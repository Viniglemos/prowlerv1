spec:
  inputs:
    pipeline_mode:
      description: "Pipeline section to run"
      default: "validate"
      options:
        - "validate"
        - "create_management_state_bucket"
        - "irsa"
        - "target"
        - "target_all"
        - "maintenance"
        - "deploy"
        - "all"

---

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

variables:
  PIPELINE_MODE: "$[[ inputs.pipeline_mode ]]"
  POSTGRES_EXISTING_SECRET: "prowler-postgres-secret"
  PROWLER_APP_EXISTING_SECRET: "prowler-app-secret"
  AWS_ACCESS_KEY_ID:
    value: ""
    description: "Temporary AWS access key for the management account. Used from pipeline_mode=target or target_all onward."
  AWS_SECRET_ACCESS_KEY:
    value: ""
    description: "Temporary AWS secret access key for the management account. Used from pipeline_mode=target or target_all onward."
  AWS_SESSION_TOKEN:
    value: ""
    description: "Temporary AWS session token for the management account. Used from pipeline_mode=target or target_all onward."
  TF_VAR_trusted_irsa_role_arn:
    value: ""
    description: "Prowler App IRSA role ARN from the tools account. Required for pipeline_mode=target or target_all."
  TARGET_ACCOUNT_ID:
    value: ""
    description: "Target AWS account ID for pipeline_mode=target. Not used by target_all."
  MANAGEMENT_STATE_BUCKET:
    value: "state-management"
    description: "S3 bucket name for management account Terraform state. Used by pipeline_mode=create_management_state_bucket."

stages:
  - validate
  - infra_plan
  - infra_apply
  - maintenance
  - deploy

helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(validate|deploy|all)$/'
  script:
    - helm lint helm/prowler-app
    - |
      helm template "${HELM_RELEASE_NAME:-prowler-app}" helm/prowler-app \
        --set app.authUrl="https://prowler-app.internal" \
        --set postgres.host="postgres.example.internal" \
        --set postgres.existingSecret="${POSTGRES_EXISTING_SECRET}" \
        --set app.secrets.create=false

terraform_validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(validate|create_management_state_bucket|irsa|target|target_all|all)$/'
  script:
    - |
      validate_irsa() {
        terraform -chdir=terraform/prowler-app-irsa fmt -check
        terraform -chdir=terraform/prowler-app-irsa init -backend=false
        terraform -chdir=terraform/prowler-app-irsa validate
      }

      validate_target() {
        terraform -chdir=terraform/prowler-target-role fmt -check
        terraform -chdir=terraform/prowler-target-role init -backend=false
        terraform -chdir=terraform/prowler-target-role validate
      }

      validate_management_state() {
        terraform -chdir=terraform/management-state-bucket fmt -check
        terraform -chdir=terraform/management-state-bucket init -backend=false
        terraform -chdir=terraform/management-state-bucket validate
      }

      case "$PIPELINE_MODE" in
        validate|all)
          validate_management_state
          validate_irsa
          validate_target
          ;;
        create_management_state_bucket)
          validate_management_state
          ;;
        irsa)
          validate_irsa
          ;;
        target|target_all)
          validate_target
          ;;
        *)
          echo "Unsupported PIPELINE_MODE: $PIPELINE_MODE" >&2
          exit 2
          ;;
      esac

create_management_state_bucket:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(create_management_state_bucket|all)$/'
      when: manual
  script:
    - terraform -chdir=terraform/management-state-bucket init -backend=false
    - terraform -chdir=terraform/management-state-bucket apply -auto-approve -var="aws_region=${AWS_REGION:-us-east-1}" -var="bucket_name=${MANAGEMENT_STATE_BUCKET}"
    - terraform -chdir=terraform/management-state-bucket output -raw bucket_name
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - terraform/management-state-bucket/terraform.tfstate
  allow_failure: false
  manual_confirmation: "Create the S3 backend bucket for management Terraform state?"

terraform_plan_irsa:
  stage: infra_plan
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(irsa|all)$/'
      when: manual
  script:
    - |
      if [ -z "$TF_VAR_oidc_provider_arn" ] || [ -z "$TF_VAR_oidc_provider_url" ]; then
        echo "TF_VAR_oidc_provider_arn and TF_VAR_oidc_provider_url are required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-app-irsa init ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-app-irsa plan -out=tfplan -var="aws_region=${AWS_REGION:-us-east-1}"
  artifacts:
    expire_in: 1 day
    paths:
      - terraform/prowler-app-irsa/tfplan

terraform_apply_irsa:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_plan_irsa
  rules:
    - if: '$PIPELINE_MODE =~ /^(irsa|all)$/'
      when: manual
  script:
    - terraform -chdir=terraform/prowler-app-irsa init ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-app-irsa apply -auto-approve tfplan
    - terraform -chdir=terraform/prowler-app-irsa output -raw role_arn
  allow_failure: false
  manual_confirmation: "Apply Terraform changes for the Prowler App IRSA role?"

terraform_plan_target_role:
  stage: infra_plan
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(target|all)$/'
      when: manual
  script:
    - |
      if [ -z "$TARGET_ACCOUNT_ID" ] || [ -z "$TF_VAR_trusted_irsa_role_arn" ]; then
        echo "TARGET_ACCOUNT_ID and TF_VAR_trusted_irsa_role_arn are required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-target-role init -backend-config="key=prowler-target-role/${TARGET_ACCOUNT_ID}.tfstate" ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-target-role plan -out=tfplan -var="aws_region=${AWS_REGION:-us-east-1}" -var="target_account_id=${TARGET_ACCOUNT_ID}"
  artifacts:
    expire_in: 1 day
    paths:
      - terraform/prowler-target-role/tfplan

terraform_apply_target_role:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_plan_target_role
  rules:
    - if: '$PIPELINE_MODE =~ /^(target|all)$/'
      when: manual
  script:
    - |
      if [ -z "$TARGET_ACCOUNT_ID" ]; then
        echo "TARGET_ACCOUNT_ID is required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-target-role init -backend-config="key=prowler-target-role/${TARGET_ACCOUNT_ID}.tfstate" ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-target-role apply -auto-approve tfplan
    - terraform -chdir=terraform/prowler-target-role output -raw role_arn
  allow_failure: false
  manual_confirmation: "Apply Terraform changes for target account ProwlerScanRole?"

terraform_apply_all_target_roles:
  stage: infra_apply
  image:
    name: python:3.12-slim
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(target_all|all)$/'
      when: manual
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl unzip jq ca-certificates
    - pip install --no-cache-dir awscli
    - curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
    - unzip -q /tmp/terraform.zip -d /usr/local/bin
    - terraform version
    - aws --version
  script:
    - |
      if [ -z "$TF_VAR_trusted_irsa_role_arn" ]; then
        echo "TF_VAR_trusted_irsa_role_arn is required." >&2
        exit 2
      fi

      aws organizations list-accounts \
        --query 'Accounts[?Status==`ACTIVE`].Id' \
        --output json | jq -r '.[]' > target-accounts.txt

      if [ ! -s target-accounts.txt ]; then
        echo "No active AWS Organizations accounts found." >&2
        exit 2
      fi

      while IFS= read -r account_id; do
        echo "Applying ProwlerScanRole in account $account_id"
        terraform -chdir=terraform/prowler-target-role init \
          -backend-config="key=prowler-target-role/${account_id}.tfstate" \
          ${TF_INIT_ARGS:-}
        terraform -chdir=terraform/prowler-target-role apply -auto-approve \
          -var="aws_region=${AWS_REGION:-us-east-1}" \
          -var="target_account_id=${account_id}"
      done < target-accounts.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target-accounts.txt
  allow_failure: false
  manual_confirmation: "Apply ProwlerScanRole to all active AWS Organizations accounts?"

update_postgres_secret:
  stage: maintenance
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(maintenance|all)$/'
      when: manual
  script:
    - |
      AGENT_CONTEXT="${AGENT_CONTEXT:-positivote/iac/tools/cluster-management/gitlab-agents:tools-educacional-agent}"
      KUBE_NAMESPACE="${KUBE_NAMESPACE:-security-audit}"

      if [ -z "$POSTGRES_EXISTING_SECRET" ]; then
        echo "POSTGRES_EXISTING_SECRET is required." >&2
        exit 2
      fi

      if [ -z "$POSTGRES_ADMIN_PASSWORD" ] || [ -z "$POSTGRES_PASSWORD" ]; then
        echo "POSTGRES_ADMIN_PASSWORD and POSTGRES_PASSWORD are required as masked GitLab variables." >&2
        exit 2
      fi

      kubectl config use-context "$AGENT_CONTEXT"
      kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic "$POSTGRES_EXISTING_SECRET" \
        --namespace "$KUBE_NAMESPACE" \
        --from-literal=POSTGRES_ADMIN_PASSWORD="$POSTGRES_ADMIN_PASSWORD" \
        --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
        --dry-run=client \
        -o yaml | kubectl apply -f -
  allow_failure: false
  manual_confirmation: "Create or update the Kubernetes Secret that stores the Postgres passwords?"

update_prowler_app_secret:
  stage: maintenance
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(maintenance|all)$/'
      when: manual
  script:
    - |
      AGENT_CONTEXT="${AGENT_CONTEXT:-positivote/iac/tools/cluster-management/gitlab-agents:tools-educacional-agent}"
      KUBE_NAMESPACE="${KUBE_NAMESPACE:-security-audit}"
      PROWLER_APP_EXISTING_SECRET="${PROWLER_APP_EXISTING_SECRET:-prowler-app-secret}"

      if [ -z "$AUTH_SECRET" ] || [ -z "$DJANGO_TOKEN_SIGNING_KEY" ] || [ -z "$DJANGO_TOKEN_VERIFYING_KEY" ] || [ -z "$DJANGO_SECRETS_ENCRYPTION_KEY" ] || [ -z "$VALKEY_PASSWORD" ]; then
        echo "AUTH_SECRET, DJANGO_TOKEN_SIGNING_KEY, DJANGO_TOKEN_VERIFYING_KEY, DJANGO_SECRETS_ENCRYPTION_KEY and VALKEY_PASSWORD are required as masked GitLab variables." >&2
        exit 2
      fi

      kubectl config use-context "$AGENT_CONTEXT"
      kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic "$PROWLER_APP_EXISTING_SECRET" \
        --namespace "$KUBE_NAMESPACE" \
        --from-literal=AUTH_SECRET="$AUTH_SECRET" \
        --from-literal=DJANGO_TOKEN_SIGNING_KEY="$DJANGO_TOKEN_SIGNING_KEY" \
        --from-literal=DJANGO_TOKEN_VERIFYING_KEY="$DJANGO_TOKEN_VERIFYING_KEY" \
        --from-literal=DJANGO_SECRETS_ENCRYPTION_KEY="$DJANGO_SECRETS_ENCRYPTION_KEY" \
        --from-literal=VALKEY_PASSWORD="$VALKEY_PASSWORD" \
        --dry-run=client \
        -o yaml | kubectl apply -f -
  allow_failure: false
  manual_confirmation: "Create or update the Kubernetes Secret that stores the Prowler App internal secrets?"

deploy_app:
  stage: deploy
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  needs:
    - helm_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(deploy|all)$/'
      when: manual
  script:
    - |
      AGENT_CONTEXT="${AGENT_CONTEXT:-positivote/iac/tools/cluster-management/gitlab-agents:tools-educacional-agent}"
      HELM_RELEASE_NAME="${HELM_RELEASE_NAME:-prowler-app}"
      KUBE_NAMESPACE="${KUBE_NAMESPACE:-security-audit}"
      PROWLER_APP_AUTH_URL="${PROWLER_APP_AUTH_URL:-https://prowler.educacional.app}"
      PROWLER_APP_GATEWAY_HOST="${PROWLER_APP_GATEWAY_HOST:-prowler.educacional.app}"
      PROWLER_APP_GATEWAY_ENABLED="${PROWLER_APP_GATEWAY_ENABLED:-true}"
      POSTGRES_PORT="${POSTGRES_PORT:-5432}"

      if [ -z "$POSTGRES_EXISTING_SECRET" ]; then
        echo "POSTGRES_EXISTING_SECRET is required for deploy." >&2
        exit 2
      fi

      if [ -z "$POSTGRES_HOST" ] || [ -z "$POSTGRES_DATABASE" ] || [ -z "$POSTGRES_USER" ]; then
        echo "POSTGRES_HOST, POSTGRES_DATABASE and POSTGRES_USER are required for deploy." >&2
        exit 2
      fi

      if [ -z "$PROWLER_APP_IRSA_ROLE_ARN" ]; then
        echo "PROWLER_APP_IRSA_ROLE_ARN is required for deploy." >&2
        exit 2
      fi

      kubectl config use-context "$AGENT_CONTEXT"
      kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install "$HELM_RELEASE_NAME" helm/prowler-app \
        --namespace "$KUBE_NAMESPACE" \
        --set app.authUrl="$PROWLER_APP_AUTH_URL" \
        --set postgres.host="$POSTGRES_HOST" \
        --set postgres.port="$POSTGRES_PORT" \
        --set postgres.database="$POSTGRES_DATABASE" \
        --set postgres.adminUser="$POSTGRES_USER" \
        --set postgres.appUser="$POSTGRES_USER" \
        --set postgres.existingSecret="$POSTGRES_EXISTING_SECRET" \
        --set serviceAccount.irsaRoleArn="$PROWLER_APP_IRSA_ROLE_ARN" \
        --set gateway.enabled="$PROWLER_APP_GATEWAY_ENABLED" \
        --set gateway.host="$PROWLER_APP_GATEWAY_HOST" \
        --set app.secrets.create=false
  allow_failure: false
  manual_confirmation: "Deploy or upgrade the Prowler App in Kubernetes?"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  HELM_RELEASE_NAME: "prowler-app"
  KUBE_CONTEXT: ""
  KUBE_NAMESPACE: "security-audit"
  APP_AUTH_URL: ""
  POSTGRES_HOST: ""
  POSTGRES_EXISTING_SECRET: "prowler-postgres-secret"
  PROWLER_APP_SECRET_EXISTING_SECRET: ""
  PROWLER_APP_IRSA_ROLE_ARN: ""
  AWS_REGION: "us-east-1"
  TF_INIT_ARGS: "-backend=false"
  ALLOW_LOCAL_TF_STATE: "false"
  TF_VAR_oidc_provider_arn: ""
  TF_VAR_oidc_provider_url: ""
  TF_VAR_target_account_ids: "[]"
  TF_VAR_trusted_irsa_role_arn: ""
  TF_VAR_external_id: ""

stages:
  - validate
  - infra_plan
  - infra_apply
  - deploy

helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  script:
    - helm lint helm/prowler-app
    - |
      helm template "$HELM_RELEASE_NAME" helm/prowler-app \
        --set app.authUrl="${APP_AUTH_URL:-https://prowler-app.internal}" \
        --set postgres.host="${POSTGRES_HOST:-postgres.example.internal}" \
        --set postgres.existingSecret="${POSTGRES_EXISTING_SECRET}" \
        --set app.secrets.authSecret="dummy-auth-secret" \
        --set app.secrets.djangoTokenSigningKey="dummy-signing-key" \
        --set app.secrets.djangoTokenVerifyingKey="dummy-verifying-key" \
        --set app.secrets.djangoSecretsEncryptionKey="dummy-encryption-key"

terraform_validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  script:
    - terraform -chdir=terraform/prowler-app-irsa fmt -check
    - terraform -chdir=terraform/prowler-target-role fmt -check
    - terraform -chdir=terraform/prowler-app-irsa init -backend=false
    - terraform -chdir=terraform/prowler-app-irsa validate
    - terraform -chdir=terraform/prowler-target-role init -backend=false
    - terraform -chdir=terraform/prowler-target-role validate

terraform_plan_irsa:
  stage: infra_plan
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  script:
    - |
      if [ -z "$TF_VAR_oidc_provider_arn" ] || [ -z "$TF_VAR_oidc_provider_url" ]; then
        echo "TF_VAR_oidc_provider_arn and TF_VAR_oidc_provider_url are required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-app-irsa init $TF_INIT_ARGS
    - terraform -chdir=terraform/prowler-app-irsa plan -out=tfplan -var="aws_region=$AWS_REGION"
  artifacts:
    expire_in: 1 day
    paths:
      - terraform/prowler-app-irsa/tfplan
  when: manual

terraform_apply_irsa:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_plan_irsa
  script:
    - |
      if [ "$TF_INIT_ARGS" = "-backend=false" ] && [ "$ALLOW_LOCAL_TF_STATE" != "true" ]; then
        echo "Configure a Terraform backend through TF_INIT_ARGS before apply, or set ALLOW_LOCAL_TF_STATE=true for a disposable test." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-app-irsa init $TF_INIT_ARGS
    - terraform -chdir=terraform/prowler-app-irsa apply -auto-approve tfplan
    - terraform -chdir=terraform/prowler-app-irsa output -raw role_arn
  when: manual

terraform_plan_target_role:
  stage: infra_plan
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  script:
    - |
      if [ -z "$TF_VAR_trusted_irsa_role_arn" ]; then
        echo "TF_VAR_trusted_irsa_role_arn is required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-target-role init $TF_INIT_ARGS
    - terraform -chdir=terraform/prowler-target-role plan -out=tfplan -var="aws_region=$AWS_REGION"
  artifacts:
    expire_in: 1 day
    paths:
      - terraform/prowler-target-role/tfplan
  when: manual

terraform_apply_target_role:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_plan_target_role
  script:
    - |
      if [ "$TF_INIT_ARGS" = "-backend=false" ] && [ "$ALLOW_LOCAL_TF_STATE" != "true" ]; then
        echo "Configure a Terraform backend through TF_INIT_ARGS before apply, or set ALLOW_LOCAL_TF_STATE=true for a disposable test." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-target-role init $TF_INIT_ARGS
    - terraform -chdir=terraform/prowler-target-role apply -auto-approve tfplan
    - terraform -chdir=terraform/prowler-target-role output -raw role_arn
  when: manual

deploy:
  stage: deploy
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  needs:
    - helm_validate
  script:
    - |
      if [ -z "$KUBE_CONTEXT" ]; then
        echo "KUBE_CONTEXT is required for deploy." >&2
        exit 2
      fi
      if [ -z "$POSTGRES_HOST" ]; then
        echo "POSTGRES_HOST is required for deploy." >&2
        exit 2
      fi
      if [ -z "$APP_AUTH_URL" ]; then
        echo "APP_AUTH_URL is required for deploy." >&2
        exit 2
      fi
      if [ -z "$PROWLER_APP_SECRET_EXISTING_SECRET" ]; then
        echo "PROWLER_APP_SECRET_EXISTING_SECRET is required for deploy." >&2
        exit 2
      fi
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - |
      IRSA_SET_ARGS=""
      if [ -n "${PROWLER_APP_IRSA_ROLE_ARN:-}" ]; then
        IRSA_SET_ARGS="--set serviceAccount.irsaRoleArn=${PROWLER_APP_IRSA_ROLE_ARN}"
      fi

      helm upgrade --install "$HELM_RELEASE_NAME" helm/prowler-app \
        --namespace "$KUBE_NAMESPACE" \
        --set app.authUrl="$APP_AUTH_URL" \
        --set postgres.host="$POSTGRES_HOST" \
        --set postgres.existingSecret="$POSTGRES_EXISTING_SECRET" \
        --set app.secrets.create=false \
        --set app.secrets.existingSecret="$PROWLER_APP_SECRET_EXISTING_SECRET" \
        $IRSA_SET_ARGS
  when: manual

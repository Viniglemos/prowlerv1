spec:
  inputs:
    pipeline_mode:
      description: "Pipeline section to run"
      default: "validate"
      options:
        - "validate"
        - "create_management_state_bucket"
        - "irsa"
        - "target_all"
        - "maintenance"
        - "deploy"
        - "all"

---

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

default:
  tags:
    - tools

variables:
  PIPELINE_MODE: "$[[ inputs.pipeline_mode ]]"
  POSTGRES_EXISTING_SECRET: "prowler-enviado-pelo-db"
  PROWLER_APP_EXISTING_SECRET: "prowler-app-secret"
  AWS_ACCESS_KEY_ID:
    value: ""
    description: "Temporary AWS access key for the management account. Used from pipeline_mode=target_all onward."
  AWS_SECRET_ACCESS_KEY:
    value: ""
    description: "Temporary AWS secret access key for the management account. Used from pipeline_mode=target_all onward."
  AWS_SESSION_TOKEN:
    value: ""
    description: "Temporary AWS session token for the management account. Used from pipeline_mode=target_all onward."
  TF_VAR_trusted_irsa_role_arn:
    value: ""
    description: "Prowler App IRSA role ARN from the tools account. Required for pipeline_mode=target_all."
  MANAGEMENT_STATE_BUCKET:
    value: ""
    description: "Globally unique S3 bucket name for management account Terraform state, for example state-management-prowler-<management-account-id>."
  PROWLER_APP_IRSA_ROLE_ARN:
    value: ""
    description: "Deploy only: IRSA role ARN created in the tools/EKS account for the Prowler App ServiceAccount."

stages:
  - validate
  - infra_plan
  - infra_apply
  - maintenance
  - deploy

helm_validate:
  stage: validate
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(validate|deploy|all)$/'
  script:
    - helm lint helm/prowler-app
    - |
      helm template "${HELM_RELEASE_NAME:-prowler-app}" helm/prowler-app \
        --set app.authUrl="https://prowler-app.internal" \
        --set postgres.host="postgres.example.internal" \
        --set postgres.existingSecret="${POSTGRES_EXISTING_SECRET}" \
        --set app.secrets.create=false

terraform_validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(validate|create_management_state_bucket|irsa|target_all|all)$/'
  script:
    - |
      validate_irsa() {
        terraform -chdir=terraform/prowler-app-irsa fmt -check
        terraform -chdir=terraform/prowler-app-irsa init -backend=false
        terraform -chdir=terraform/prowler-app-irsa validate
      }

      validate_management_state() {
        terraform -chdir=terraform/management-state-bucket fmt -check
        terraform -chdir=terraform/management-state-bucket init -backend=false
        terraform -chdir=terraform/management-state-bucket validate
      }

      validate_target_stackset() {
        terraform -chdir=terraform/prowler-target-stackset fmt -check
        terraform -chdir=terraform/prowler-target-stackset init -backend=false
        terraform -chdir=terraform/prowler-target-stackset validate
      }

      case "$PIPELINE_MODE" in
        validate|all)
          validate_management_state
          validate_target_stackset
          validate_irsa
          ;;
        create_management_state_bucket)
          validate_management_state
          ;;
        irsa)
          validate_irsa
          ;;
        target_all)
          validate_target_stackset
          ;;
        *)
          echo "Unsupported PIPELINE_MODE: $PIPELINE_MODE" >&2
          exit 2
          ;;
      esac

create_management_state_bucket:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(create_management_state_bucket|all)$/'
      when: manual
  script:
    - |
      if [ -z "$MANAGEMENT_STATE_BUCKET" ]; then
        echo "MANAGEMENT_STATE_BUCKET is required. Use a globally unique S3 bucket name." >&2
        exit 2
      fi
    - terraform -chdir=terraform/management-state-bucket init -backend=false
    - terraform -chdir=terraform/management-state-bucket apply -auto-approve -var="aws_region=us-east-1" -var="bucket_name=${MANAGEMENT_STATE_BUCKET}"
    - terraform -chdir=terraform/management-state-bucket output -raw bucket_name
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - terraform/management-state-bucket/terraform.tfstate
  allow_failure: false
  manual_confirmation: "Create the S3 backend bucket for management Terraform state?"

terraform_plan_irsa:
  stage: infra_plan
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(irsa|all)$/'
      when: manual
  script:
    - |
      if [ -z "$TF_VAR_oidc_provider_arn" ] || [ -z "$TF_VAR_oidc_provider_url" ]; then
        echo "TF_VAR_oidc_provider_arn and TF_VAR_oidc_provider_url are required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-app-irsa init ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-app-irsa plan -out=tfplan -var="aws_region=${AWS_REGION:-us-east-1}"
  artifacts:
    expire_in: 1 day
    paths:
      - terraform/prowler-app-irsa/tfplan

terraform_apply_irsa:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_plan_irsa
  rules:
    - if: '$PIPELINE_MODE =~ /^(irsa|all)$/'
      when: manual
  script:
    - terraform -chdir=terraform/prowler-app-irsa init ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-app-irsa apply -auto-approve tfplan
    - terraform -chdir=terraform/prowler-app-irsa output -raw role_arn
  allow_failure: false
  manual_confirmation: "Apply Terraform changes for the Prowler App IRSA role?"

terraform_plan_all_target_roles:
  stage: infra_plan
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(target_all|all)$/'
      when: manual
  script:
    - |
      if [ -z "$TF_VAR_trusted_irsa_role_arn" ]; then
        echo "TF_VAR_trusted_irsa_role_arn is required." >&2
        exit 2
      fi
      if [ -z "$MANAGEMENT_STATE_BUCKET" ]; then
        echo "MANAGEMENT_STATE_BUCKET is required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-target-stackset init -backend-config="bucket=${MANAGEMENT_STATE_BUCKET}" -backend-config="region=us-east-1" ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-target-stackset plan -out=tfplan -var="aws_region=us-east-1"
  artifacts:
    expire_in: 1 day
    paths:
      - terraform/prowler-target-stackset/tfplan

terraform_apply_all_target_roles:
  stage: infra_apply
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  needs:
    - terraform_plan_all_target_roles
  rules:
    - if: '$PIPELINE_MODE =~ /^(target_all|all)$/'
      when: manual
  script:
    - |
      if [ -z "$MANAGEMENT_STATE_BUCKET" ]; then
        echo "MANAGEMENT_STATE_BUCKET is required." >&2
        exit 2
      fi
    - terraform -chdir=terraform/prowler-target-stackset init -backend-config="bucket=${MANAGEMENT_STATE_BUCKET}" -backend-config="region=us-east-1" ${TF_INIT_ARGS:-}
    - terraform -chdir=terraform/prowler-target-stackset apply -auto-approve tfplan
    - terraform -chdir=terraform/prowler-target-stackset output
  allow_failure: false
  manual_confirmation: "Apply ProwlerScanRole StackSet to all AWS Organizations accounts?"

update_postgres_secret:
  stage: maintenance
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(maintenance|all)$/'
      when: manual
  script:
    - |
      AGENT_CONTEXT="${AGENT_CONTEXT:-positivote/iac/tools/cluster-management/gitlab-agents:tools-educacional-agent}"
      KUBE_NAMESPACE="${KUBE_NAMESPACE:-security-audit}"

      if [ -z "$POSTGRES_EXISTING_SECRET" ]; then
        echo "POSTGRES_EXISTING_SECRET is required." >&2
        exit 2
      fi

      if [ -z "$POSTGRES_ADMIN_PASSWORD" ] || [ -z "$POSTGRES_PASSWORD" ]; then
        echo "POSTGRES_ADMIN_PASSWORD and POSTGRES_PASSWORD are required as masked GitLab variables." >&2
        exit 2
      fi

      kubectl config use-context "$AGENT_CONTEXT"
      kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic "$POSTGRES_EXISTING_SECRET" \
        --namespace "$KUBE_NAMESPACE" \
        --from-literal=POSTGRES_ADMIN_PASSWORD="$POSTGRES_ADMIN_PASSWORD" \
        --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
        --dry-run=client \
        -o yaml | kubectl apply -f -
  allow_failure: false
  manual_confirmation: "Create or update the Kubernetes Secret that stores the Postgres passwords?"

update_prowler_app_secret:
  stage: maintenance
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE =~ /^(maintenance|all)$/'
      when: manual
  script:
    - |
      AGENT_CONTEXT="${AGENT_CONTEXT:-positivote/iac/tools/cluster-management/gitlab-agents:tools-educacional-agent}"
      KUBE_NAMESPACE="${KUBE_NAMESPACE:-security-audit}"
      PROWLER_APP_EXISTING_SECRET="${PROWLER_APP_EXISTING_SECRET:-prowler-app-secret}"

      if [ -n "${DJANGO_TOKEN_SIGNING_KEY_B64:-}" ]; then
        DJANGO_TOKEN_SIGNING_KEY="$(printf '%s' "$DJANGO_TOKEN_SIGNING_KEY_B64" | base64 -d)"
      fi

      if [ -n "${DJANGO_TOKEN_VERIFYING_KEY_B64:-}" ]; then
        DJANGO_TOKEN_VERIFYING_KEY="$(printf '%s' "$DJANGO_TOKEN_VERIFYING_KEY_B64" | base64 -d)"
      fi

      if [ -z "$AUTH_SECRET" ] || [ -z "$DJANGO_TOKEN_SIGNING_KEY" ] || [ -z "$DJANGO_TOKEN_VERIFYING_KEY" ] || [ -z "$DJANGO_SECRETS_ENCRYPTION_KEY" ]; then
        echo "AUTH_SECRET, DJANGO_TOKEN_SIGNING_KEY or DJANGO_TOKEN_SIGNING_KEY_B64, DJANGO_TOKEN_VERIFYING_KEY or DJANGO_TOKEN_VERIFYING_KEY_B64, and DJANGO_SECRETS_ENCRYPTION_KEY are required as masked GitLab variables." >&2
        exit 2
      fi

      if ! printf '%s' "$DJANGO_SECRETS_ENCRYPTION_KEY" | grep -Eq '^[A-Za-z0-9_-]{43}=$'; then
        echo "DJANGO_SECRETS_ENCRYPTION_KEY must be a Fernet key: 32 url-safe base64-encoded bytes, usually 44 characters ending with '='." >&2
        exit 2
      fi

      kubectl config use-context "$AGENT_CONTEXT"
      kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic "$PROWLER_APP_EXISTING_SECRET" \
        --namespace "$KUBE_NAMESPACE" \
        --from-literal=AUTH_SECRET="$AUTH_SECRET" \
        --from-literal=DJANGO_TOKEN_SIGNING_KEY="$DJANGO_TOKEN_SIGNING_KEY" \
        --from-literal=DJANGO_TOKEN_VERIFYING_KEY="$DJANGO_TOKEN_VERIFYING_KEY" \
        --from-literal=DJANGO_SECRETS_ENCRYPTION_KEY="$DJANGO_SECRETS_ENCRYPTION_KEY" \
        --from-literal=NEO4J_PASSWORD="${NEO4J_PASSWORD:-}" \
        --from-literal=PROWLER_APP_API_TOKEN="${PROWLER_APP_API_TOKEN:-}" \
        --dry-run=client \
        -o yaml | kubectl apply -f -
  allow_failure: false
  manual_confirmation: "Create or update the Kubernetes Secret that stores the Prowler App internal secrets?"

deploy_app:
  stage: deploy
  image:
    name: alpine/k8s:1.30.2
    entrypoint: [""]
  needs:
    - helm_validate
  rules:
    - if: '$PIPELINE_MODE =~ /^(deploy|all)$/'
      when: manual
  script:
    - |
      AGENT_CONTEXT="${AGENT_CONTEXT:-positivote/iac/tools/cluster-management/gitlab-agents:tools-educacional-agent}"
      HELM_RELEASE_NAME="${HELM_RELEASE_NAME:-prowler-app}"
      KUBE_NAMESPACE="${KUBE_NAMESPACE:-security-audit}"
      PROWLER_APP_AUTH_URL="${PROWLER_APP_AUTH_URL:-https://prowler.educacional.app}"
      PROWLER_APP_ALLOWED_HOSTS="${PROWLER_APP_ALLOWED_HOSTS:-localhost,127.0.0.1,prowler-app-api,prowler.educacional.app}"
      PROWLER_APP_GATEWAY_HOST="${PROWLER_APP_GATEWAY_HOST:-prowler.educacional.app}"
      PROWLER_APP_GATEWAY_ENABLED="${PROWLER_APP_GATEWAY_ENABLED:-true}"
      PROWLER_NIGHTLY_SCANS_ENABLED="${PROWLER_NIGHTLY_SCANS_ENABLED:-false}"
      PROWLER_NIGHTLY_SCANS_AUTH_SECRET="${PROWLER_NIGHTLY_SCANS_AUTH_SECRET:-$PROWLER_APP_EXISTING_SECRET}"
      PROWLER_NIGHTLY_PROVIDER_IDS_GROUP_A="${PROWLER_NIGHTLY_PROVIDER_IDS_GROUP_A:-}"
      PROWLER_NIGHTLY_PROVIDER_IDS_GROUP_B="${PROWLER_NIGHTLY_PROVIDER_IDS_GROUP_B:-}"
      PROWLER_MCP_ENABLED="${PROWLER_MCP_ENABLED:-false}"
      PROWLER_APP_ALLOWED_HOSTS_HELM="$(printf '%s' "$PROWLER_APP_ALLOWED_HOSTS" | sed 's/,/\\,/g')"

      if [ -n "$POSTGRES_USER" ] && ! printf '%s' "$POSTGRES_USER" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
        echo "POSTGRES_USER must be a PostgreSQL identifier without hyphens because Prowler migrations create roles with this value. Use underscores, for example prd_prowler_user." >&2
        exit 2
      fi

      if [ -z "$PROWLER_APP_IRSA_ROLE_ARN" ]; then
        echo "PROWLER_APP_IRSA_ROLE_ARN not set as CI variable; using value from values.yaml."
      fi

      IRSA_SET=""
      if [ -n "$PROWLER_APP_IRSA_ROLE_ARN" ]; then
        IRSA_SET="--set serviceAccount.irsaRoleArn=$PROWLER_APP_IRSA_ROLE_ARN"
      fi

      POSTGRES_SET=""
      if [ -n "$POSTGRES_HOST" ]; then
        POSTGRES_SET="$POSTGRES_SET --set postgres.host=$POSTGRES_HOST"
      fi
      if [ -n "$POSTGRES_PORT" ]; then
        POSTGRES_SET="$POSTGRES_SET --set postgres.port=$POSTGRES_PORT"
      fi
      if [ -n "$POSTGRES_DATABASE" ]; then
        POSTGRES_SET="$POSTGRES_SET --set postgres.database=$POSTGRES_DATABASE"
      fi
      if [ -n "$POSTGRES_USER" ]; then
        POSTGRES_SET="$POSTGRES_SET --set postgres.adminUser=$POSTGRES_USER --set postgres.appUser=$POSTGRES_USER"
      fi
      if [ -n "$POSTGRES_EXISTING_SECRET" ]; then
        POSTGRES_SET="$POSTGRES_SET --set postgres.existingSecret=$POSTGRES_EXISTING_SECRET"
      fi

      kubectl config use-context "$AGENT_CONTEXT"
      kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      helm upgrade --install "$HELM_RELEASE_NAME" helm/prowler-app \
        --namespace "$KUBE_NAMESPACE" \
        --set app.authUrl="$PROWLER_APP_AUTH_URL" \
        $POSTGRES_SET \
        $IRSA_SET \
        --set-string app.allowedHosts="$PROWLER_APP_ALLOWED_HOSTS_HELM" \
        --set gateway.enabled="$PROWLER_APP_GATEWAY_ENABLED" \
        --set gateway.host="$PROWLER_APP_GATEWAY_HOST" \
        --set nightlyScans.enabled="$PROWLER_NIGHTLY_SCANS_ENABLED" \
        --set nightlyScans.auth.existingSecret="$PROWLER_NIGHTLY_SCANS_AUTH_SECRET" \
        --set nightlyScans.activeDeadlineSeconds=7200 \
        --set-string nightlyScans.groupA.providerIds="$PROWLER_NIGHTLY_PROVIDER_IDS_GROUP_A" \
        --set-string nightlyScans.groupB.providerIds="$PROWLER_NIGHTLY_PROVIDER_IDS_GROUP_B" \
        --set mcp.enabled="$PROWLER_MCP_ENABLED" \
        --set app.secrets.create=false
  allow_failure: false
  manual_confirmation: "Deploy or upgrade the Prowler App in Kubernetes?"

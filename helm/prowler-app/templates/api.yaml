apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowler-app.fullname" . }}-api
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "prowler-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "prowler-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "prowler-app.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name | quote }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "prowler-app.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command:
            - /home/prowler/docker-entrypoint.sh
            - prod
          ports:
            - name: http
              containerPort: {{ .Values.app.djangoPort }}
          envFrom:
            - configMapRef:
                name: {{ include "prowler-app.fullname" . }}-config
            - secretRef:
                name: {{ include "prowler-app.secretName" . }}
            - secretRef:
                name: {{ include "prowler-app.postgresSecretName" . }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: output
              mountPath: /tmp/prowler_api_output
            - name: config
              mountPath: /home/prowler/.config/prowler-api
      volumes:
        - name: output
          emptyDir: {}
        - name: config
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowler-app.fullname" . }}-api
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
  selector:
    {{- include "prowler-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

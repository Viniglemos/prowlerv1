{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prowler-app.serviceAccountName" . }}
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.irsaRoleArn .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.serviceAccount.irsaRoleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}

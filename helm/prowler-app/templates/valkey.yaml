{{- if .Values.valkey.enabled }}
{{- if .Values.valkey.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "prowler-app.fullname" . }}-valkey
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.valkey.persistence.size | quote }}
  {{- with .Values.valkey.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowler-app.fullname" . }}-valkey
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prowler-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "prowler-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name | quote }}
      {{- end }}
      containers:
        - name: valkey
          image: "{{ .Values.images.valkey.repository }}:{{ .Values.images.valkey.tag }}"
          imagePullPolicy: {{ .Values.images.valkey.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.valkey.port }}
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.valkey.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "prowler-app.fullname" . }}-valkey
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowler-app.fullname" . }}-valkey
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.valkey.port }}
      targetPort: redis
  selector:
    {{- include "prowler-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
{{- end }}

{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowler-app.fullname" . }}-mcp
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prowler-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "prowler-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name | quote }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "prowler-app.mcpImage" . | quote }}
          imagePullPolicy: {{ .Values.images.mcp.pullPolicy }}
          command:
            - uvicorn
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.app.mcpPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.app.mcpPort }}
          envFrom:
            - configMapRef:
                name: {{ include "prowler-app.fullname" . }}-config
            - secretRef:
                name: {{ include "prowler-app.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowler-app.fullname" . }}-mcp
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.service.mcp.type }}
  ports:
    - name: http
      port: {{ .Values.service.mcp.port }}
      targetPort: http
  selector:
    {{- include "prowler-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}

{{- if and .Values.app.secrets.create (not .Values.app.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prowler-app.secretName" . }}
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ required "app.secrets.authSecret is required" .Values.app.secrets.authSecret | quote }}
  DJANGO_TOKEN_SIGNING_KEY: {{ required "app.secrets.djangoTokenSigningKey is required" .Values.app.secrets.djangoTokenSigningKey | quote }}
  DJANGO_TOKEN_VERIFYING_KEY: {{ required "app.secrets.djangoTokenVerifyingKey is required" .Values.app.secrets.djangoTokenVerifyingKey | quote }}
  DJANGO_SECRETS_ENCRYPTION_KEY: {{ required "app.secrets.djangoSecretsEncryptionKey is required" .Values.app.secrets.djangoSecretsEncryptionKey | quote }}
  VALKEY_PASSWORD: {{ .Values.valkey.password | quote }}
  {{- range $key, $value := .Values.app.extraSecret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

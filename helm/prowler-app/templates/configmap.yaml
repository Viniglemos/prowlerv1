apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prowler-app.fullname" . }}-config
  labels:
    {{- include "prowler-app.labels" . | nindent 4 }}
data:
  PROWLER_API_VERSION: {{ .Values.images.api.tag | quote }}
  PROWLER_UI_VERSION: {{ .Values.images.ui.tag | quote }}
  PROWLER_MCP_VERSION: {{ .Values.images.mcp.tag | quote }}
  AUTH_URL: {{ required "app.authUrl is required" .Values.app.authUrl | quote }}
  API_BASE_URL: {{ printf "http://%s-api:%v/api/v1" (include "prowler-app.fullname" .) .Values.service.api.port | quote }}
  UI_API_BASE_URL: {{ printf "http://%s-api:%v/api/v1" (include "prowler-app.fullname" .) .Values.service.api.port | quote }}
  UI_API_DOCS_URL: {{ printf "%s/api/v1/docs" (required "app.authUrl is required" .Values.app.authUrl | trimSuffix "/") | quote }}
  NEXT_PUBLIC_API_BASE_URL: {{ printf "%s/api/v1" (required "app.authUrl is required" .Values.app.authUrl | trimSuffix "/") | quote }}
  NEXT_PUBLIC_API_DOCS_URL: {{ printf "%s/api/v1/docs" (required "app.authUrl is required" .Values.app.authUrl | trimSuffix "/") | quote }}
  AUTH_TRUST_HOST: "true"
  UI_PORT: {{ .Values.app.uiPort | quote }}
  PROWLER_MCP_SERVER_URL: {{ ternary (printf "http://%s-mcp:%v/mcp" (include "prowler-app.fullname" .) .Values.service.mcp.port) "" .Values.mcp.enabled | quote }}
  POSTGRES_HOST: {{ required "postgres.host is required" .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_ADMIN_USER: {{ .Values.postgres.adminUser | quote }}
  POSTGRES_USER: {{ .Values.postgres.appUser | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  VALKEY_SCHEME: "redis"
  VALKEY_USERNAME: {{ .Values.valkey.username | quote }}
  VALKEY_HOST: {{ include "prowler-app.valkeyHost" . | quote }}
  VALKEY_PORT: {{ .Values.valkey.port | quote }}
  VALKEY_DB: {{ .Values.valkey.database | quote }}
  NEO4J_HOST: {{ .Values.neo4j.host | quote }}
  NEO4J_PORT: {{ .Values.neo4j.port | quote }}
  NEO4J_USER: {{ .Values.neo4j.user | quote }}
  NEO4J_PASSWORD: ""
  DJANGO_TMP_OUTPUT_DIRECTORY: "/tmp/prowler_api_output"
  DJANGO_FINDINGS_BATCH_SIZE: "1000"
  DJANGO_ALLOWED_HOSTS: {{ .Values.app.allowedHosts | quote }}
  DJANGO_BIND_ADDRESS: "0.0.0.0"
  DJANGO_PORT: {{ .Values.app.djangoPort | quote }}
  DJANGO_DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "config.django.production"
  DJANGO_LOGGING_FORMATTER: {{ .Values.app.loggingFormatter | quote }}
  DJANGO_LOGGING_LEVEL: {{ .Values.app.loggingLevel | quote }}
  DJANGO_WORKERS: {{ .Values.app.djangoWorkers | quote }}
  GUNICORN_TIMEOUT: {{ .Values.app.gunicornTimeout | quote }}
  GUNICORN_KEEPALIVE: {{ .Values.app.gunicornKeepalive | quote }}
  DJANGO_ACCESS_TOKEN_LIFETIME: {{ .Values.app.accessTokenLifetime | quote }}
  DJANGO_REFRESH_TOKEN_LIFETIME: {{ .Values.app.refreshTokenLifetime | quote }}
  DJANGO_CACHE_MAX_AGE: "3600"
  DJANGO_STALE_WHILE_REVALIDATE: "60"
  DJANGO_MANAGE_DB_PARTITIONS: "True"
  DJANGO_BROKER_VISIBILITY_TIMEOUT: "86400"
  PROWLER_MCP_TRANSPORT_MODE: "http"
  NEXT_PUBLIC_PROWLER_RELEASE_VERSION: {{ printf "v%s" .Values.images.api.tag | quote }}
  {{- range $key, $value := .Values.app.extraConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

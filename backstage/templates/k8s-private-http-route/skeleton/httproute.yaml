apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.appName }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.appName }}
spec:
  parentRefs:
    - name: ${{ values.gatewayName }}
      namespace: ${{ values.gatewayNamespace }}
      sectionName: ${{ values.sectionName }}
  hostnames:
    - "${{ values.hostname }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${{ values.serviceName }}
          port: ${{ values.servicePort }}
          weight: 1

